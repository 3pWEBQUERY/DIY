name: CI

# Bei jedem Push und Pull Request: Typen, Unit-Tests, Build und Browser-Tests.
# Schlägt ein Schritt fehl, ist der Commit rot – bevor ein Fehler live geht.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typen & Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: die Migrationsprüfung vergleicht mit der Basis und der Reihenfolge der Commits
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Migrationsreihenfolge
        # Neue Migrationen müssen nach der letzten der Basis sortieren (PR: Zielbranch, Push: vorheriger Stand)
        env:
          MIGRATIONS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node apps/web/scripts/check-migrations.mjs
      - name: ffmpeg (Video-Tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Typen prüfen
        run: pnpm -r typecheck
      - name: Unit-Tests
        run: pnpm -r test

  e2e:
    name: Browser-Tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: werkraum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/werkraum
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      APP_URL: http://localhost:3100
      SEED_DEMO: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Datenbank (Migrationen + Demo-Daten)
        run: pnpm db:migrate && pnpm db:seed
      - name: Schema-Drift (schema.prisma ↔ Migrationen)
        # Frisch migrierte DB gegen schema.prisma: Jede Abweichung (Exit-Code 2) heisst, dass eine Migration
        # fehlt oder schema.prisma ein DB-Objekt nicht abbildet – sonst erzeugt `migrate dev` falsche Migrationen
        run: pnpm --filter @werkraum/web db:drift
      - name: Build
        run: pnpm build
      - name: Browser installieren
        run: pnpm --filter @werkraum/web exec playwright install --with-deps chromium
      - name: Browser-Tests
        run: pnpm --filter @werkraum/web e2e
      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Docker-Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen (wie Railway)
        run: docker build -t werkuno-ci --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)" .
      - name: Smoke-Start (ffmpeg, Prisma-Client und Server-Module im Image)
        run: |
          docker run --rm werkuno-ci ffmpeg -version
          docker run --rm werkuno-ci test -d /app/apps/web/src/generated/prisma
          docker run --rm -w /app/apps/web werkuno-ci node --conditions=react-server --import tsx -e 'import("./src/server/env").then(() => console.log("ok"))'
