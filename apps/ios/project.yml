name: Werkuno
options:
  bundleIdPrefix: ch.werkuno
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.4"
    # Mindest-Build-Nummer; die tatsächliche setzt „Build-Nummer setzen“ (siehe unten) aus der Git-Historie
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_LANGUAGE: de
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Werkuno:
    type: application
    platform: iOS
    sources:
      - path: Werkuno
        excludes:
          - "ThreeD/web/**"
          - "Resources/PrivacyInfo.xcprivacy"
      - path: Werkuno/ThreeD/web
        type: folder
        buildPhase: resources
      # Datenschutz-Manifest (App Store): explizit als Ressource ins App-Bundle
      - path: Werkuno/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.werkuno.app
        PRODUCT_NAME: Werkuno
        INFOPLIST_FILE: Werkuno/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Für Geräte-Builds eigenes Apple-Developer-Team eintragen (Simulator: leer lassen)
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Werkuno/Werkuno.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        # Das Skript „Build-Nummer setzen“ liest die Git-Historie und schreibt ins gebaute Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Ad-hoc-Signatur nur für lokale Debug-Builds (Simulator ohne Team);
        # Release signiert automatisch mit dem eingetragenen Team
        Debug:
          CODE_SIGN_IDENTITY: "-"
    # Build-Nummer automatisch: Anzahl Commits (steigt mit jedem Commit, also mit jedem neuen Upload
    # zu App Store Connect). Ohne Git oder bei flachem Klon (CI) gilt CURRENT_PROJECT_VERSION als
    # Mindestwert. Läuft nach dem Erzeugen des Info.plist und vor dem Signieren.
    postBuildScripts:
      - name: Build-Nummer setzen
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "$PLIST" ] || exit 0
          MIN="${CURRENT_PROJECT_VERSION:-1}"
          N=""
          if command -v git >/dev/null 2>&1; then
            N=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || true)
          fi
          case "$N" in ''|*[!0-9]*) N="$MIN" ;; esac
          case "$MIN" in ''|*[!0-9]*) MIN=1 ;; esac
          [ "$N" -lt "$MIN" ] && N="$MIN"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$PLIST" || exit 0
          echo "CFBundleVersion = $N"
  # Bedienungshilfen-Prüfung (Apple Accessibility Audit) über die wichtigsten Bildschirme
  WerkunoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WerkunoUITests
    dependencies:
      - target: Werkuno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.werkuno.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Werkuno
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
schemes:
  Werkuno:
    build:
      targets:
        Werkuno: all
        WerkunoUITests: [test]
    test:
      config: Debug
      targets:
        - WerkunoUITests
    run:
      config: Debug
      # Käufe aus Xcode laufen über Apples Sandbox (Sandbox-Apple-Account auf dem Gerät), damit der
      # Server sie wie in TestFlight und im App-Review annimmt. Für rein lokale Tests ohne App Store
      # Connect: in Xcode unter Scheme › Run › Options „StoreKit/Werkuno.storekit“ wählen
      # (nur gegen einen lokalen Server mit APPLE_IAP_ALLOW_XCODE=true).
