name: Werkuno
options:
  bundleIdPrefix: ch.werkuno
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: de
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Werkuno:
    type: application
    platform: iOS
    sources:
      - path: Werkuno
        excludes:
          - "ThreeD/web/**"
      - path: Werkuno/ThreeD/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.werkuno.app
        PRODUCT_NAME: Werkuno
        INFOPLIST_FILE: Werkuno/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Für Geräte-Builds eigenes Apple-Developer-Team eintragen (Simulator: leer lassen)
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Werkuno/Werkuno.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  Werkuno:
    build:
      targets:
        Werkuno: all
    run:
      config: Debug
      # Lokaler Test der In-App-Käufe (digitale Produkte) ohne App Store Connect
      storeKitConfiguration: StoreKit/Werkuno.storekit
